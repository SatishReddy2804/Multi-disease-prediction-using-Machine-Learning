    age: {min: 18, max: 100, unit: "years"}
    sex: {allowed: [0, 1], unit: "binary"}
    cp: {allowed: [1, 2, 3, 4], unit: "category"}
    trestbps: {min: 60, max: 240, normal_min: 90, normal_max: 120, unit: "mm Hg"}
    chol: {min: 100, max: 600, normal_min: 125, normal_max: 200, unit: "mg/dl"}
    fbs: {allowed: [0, 1], unit: "binary"}
    restecg: {allowed: [0, 1, 2], unit: "category"}
    thalach: {min: 50, max: 230, normal_min: 100, normal_max: 190, unit: "bpm"}
    exang: {allowed: [0, 1], unit: "binary"}
    oldpeak: {min: 0.0, max: 8.0, normal_min: 0.0, normal_max: 1.5, unit: "mm"}
    slope: {allowed: [1, 2, 3], unit: "category"}
    ca: {min: 0, max: 3, unit: "count"}
    thal: {allowed: [3, 6, 7], unit: "category"}

