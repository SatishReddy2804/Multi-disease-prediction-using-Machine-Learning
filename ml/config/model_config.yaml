# ==============================================================================
# Multi-Disease Prediction System - Configuration
# ==============================================================================

project:
  name: "Multi-Disease Clinical Decision Support System"
  version: "1.0.0"
  random_state: 42
  test_size: 0.20
  cv_folds: 5

paths:
  data_raw_dir: "data/raw"
  data_processed_dir: "data/processed"
  models_dir: "ml/models"
  reports_dir: "ml/reports"
  figures_dir: "ml/reports/figures"
  pdf_dir: "ml/reports/generated_pdfs"

# ==============================================================================
# Disease Dataset Schemas & Preprocessing Configurations
# ==============================================================================
diseases:
  heart:
    file_name: "heart.csv"
    has_header: false
    target: "target"
    raw_target_column: "num"
    target_mapping:
      0: 0
      1: 1
      2: 1
      3: 1
      4: 1
    missing_markers: ["?", "NA", "null", ""]
    columns:
      - "age"
      - "sex"
      - "cp"
      - "trestbps"
      - "chol"
      - "fbs"
      - "restecg"
      - "thalach"
      - "exang"
      - "oldpeak"
      - "slope"
      - "ca"
      - "thal"
      - "num"
    features:
      - "age"
      - "sex"
      - "cp"
      - "trestbps"
      - "chol"
      - "fbs"
      - "restecg"
      - "thalach"
      - "exang"
      - "oldpeak"
      - "slope"
      - "ca"
      - "thal"
    numeric_features:
      - "age"
      - "trestbps"
      - "chol"
      - "thalach"
      - "oldpeak"
      - "ca"
    categorical_features:
      - "sex"
      - "cp"
      - "fbs"
      - "restecg"
      - "exang"
      - "slope"
      - "thal"
    zero_as_missing: []
    imputation:
      numeric: "median"
      categorical: "mode"
    scaling: "standard"
    handle_imbalance: "smote"

  diabetes:
    file_name: "diabetes.csv"
    has_header: true
    target: "Outcome"
    raw_target_column: "Outcome"
    target_mapping:
      0: 0
      1: 1
    missing_markers: ["?", "NA", "null", ""]
    columns:
      - "Pregnancies"
      - "Glucose"
      - "BloodPressure"
      - "SkinThickness"
      - "Insulin"
      - "BMI"
      - "DiabetesPedigreeFunction"
      - "Age"
      - "Outcome"
    features:
      - "Pregnancies"
      - "Glucose"
      - "BloodPressure"
      - "SkinThickness"
      - "Insulin"
      - "BMI"
      - "DiabetesPedigreeFunction"
      - "Age"
    numeric_features:
      - "Pregnancies"
      - "Glucose"
      - "BloodPressure"
      - "SkinThickness"
      - "Insulin"
      - "BMI"
      - "DiabetesPedigreeFunction"
      - "Age"
    categorical_features: []
    zero_as_missing:
      - "Glucose"
      - "BloodPressure"
      - "SkinThickness"
      - "Insulin"
      - "BMI"
    imputation:
      numeric: "median"
      categorical: "mode"
    scaling: "standard"
    handle_imbalance: "smote"

  parkinsons:
    file_name: "parkinsons.csv"
    has_header: true
    target: "status"
    raw_target_column: "status"
    target_mapping:
      0: 0
      1: 1
    drop_columns:
