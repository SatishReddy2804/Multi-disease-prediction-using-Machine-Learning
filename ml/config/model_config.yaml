    "MDVP:Jitter(Abs)": {min: 0.000005, max: 0.000300, unit: "s"}
    "MDVP:RAP": {min: 0.0005, max: 0.035, unit: "ratio"}
    "MDVP:PPQ": {min: 0.0005, max: 0.035, unit: "ratio"}
