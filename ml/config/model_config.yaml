# ==============================================================================
# Cross-Risk Multi-Disease Patterns
# ==============================================================================
cross_risk_patterns:
  cardio_metabolic:
    name: "Cardio-Metabolic Syndrome"
    diseases: ["heart", "diabetes"]
    probability_threshold: 0.50
    priority: "HIGH"
    specialist: "Cardiologist & Endocrinologist"
    description: "Concurrent high cardiovascular risk and insulin resistance. Greatly increases vascular complications and coronary event rate."
    recommendations:
      - "Schedule comprehensive lipid panel and HbA1c testing."
      - "Cardiovascular stress imaging combined with glycemic review."
      - "Aggressive lifestyle intervention targeting blood pressure (<130/80) and glycemic control."

  liver_metabolic:
    name: "Hepato-Metabolic Syndrome (MASLD / NAFLD)"
    diseases: ["liver", "diabetes"]
    probability_threshold: 0.50
    priority: "HIGH"
    specialist: "Hepatologist & Endocrinologist"
    description: "Concurrent liver impairment and metabolic dysfunction, highly suggestive of Metabolic Dysfunction-Associated Steatohepatitis (MASH)."
    recommendations:
      - "Perform abdominal ultrasound or transient elastography (FibroScan) to assess hepatic steatosis/fibrosis."
      - "Evaluate LFT trends and glycemic variability."
      - "Target modest weight reduction (7-10%) and avoid hepatotoxic medications/alcohol."

  cardio_hepatic:
    name: "Cardio-Hepatic Axis Impairment"
    diseases: ["heart", "liver"]
    probability_threshold: 0.50
    priority: "HIGH"
    specialist: "Cardiologist & Hepatologist"
    description: "Concurrent heart and liver disease risk, potentially indicating congestive hepatopathy or systemic vascular congestion."
    recommendations:
