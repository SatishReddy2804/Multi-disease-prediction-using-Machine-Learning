      - "Gender"
    category_encodings:
      Gender:
        Male: 1
        Female: 0
    zero_as_missing: []
    imputation:
      numeric: "median"
      categorical: "mode"
    scaling: "standard"
    handle_imbalance: "smote"

# ==============================================================================
# Model Hyperparameter Grids (for GridSearchCV / RandomizedSearchCV)
# ==============================================================================
model_grids:
  RandomForest:
    estimator: "RandomForestClassifier"
    param_grid:
      n_estimators: [50, 100]
      max_depth: [null, 10]
      min_samples_split: [2, 5]
      min_samples_leaf: [1, 2]
      class_weight: ["balanced", null]
      random_state: [42]

  XGBoost:
    estimator: "XGBClassifier"
    param_grid:
      n_estimators: [50, 100]
      max_depth: [3, 5]
      learning_rate: [0.05, 0.1]
      subsample: [0.8, 1.0]
      eval_metric: ["logloss"]
      random_state: [42]

  LogisticRegression:
    estimator: "LogisticRegression"
    param_grid:
      C: [0.1, 1.0, 10.0]
      penalty: ["l2"]
      solver: ["lbfgs", "liblinear"]
      max_iter: [1000]
      random_state: [42]

  SVM:
    estimator: "SVC"
    param_grid:
      C: [0.1, 1.0, 10.0]
      kernel: ["linear", "rbf"]
      probability: [true]
      random_state: [42]

  KNN:
    estimator: "KNeighborsClassifier"
    param_grid:
      n_neighbors: [3, 5, 7, 9]
      weights: ["uniform", "distance"]

  DecisionTree:
    estimator: "DecisionTreeClassifier"
    param_grid:
      max_depth: [3, 5, 10, null]
      min_samples_split: [2, 5]
      criterion: ["gini", "entropy"]
      random_state: [42]

  NaiveBayes:
    estimator: "GaussianNB"
    param_grid:
      var_smoothing: [1.0e-9, 1.0e-8, 1.0e-7]

# ==============================================================================
# Uncertainty & Anomaly Thresholds
# ==============================================================================
uncertainty:
  confidence_low_threshold: 0.40
  confidence_high_threshold: 0.60
  rf_variance_threshold: 0.08
  isolation_forest:
    contamination: 0.05
    n_estimators: 100
    random_state: 42
  trust_badges:
    high:
      label: "RELIABLE"
      description: "High predictive certainty, in-distribution input, consistent ensemble votes."
      badge_color: "green"
    medium:
      label: "UNCERTAIN"
      description: "Moderate prediction confidence near the decision boundary or elevated ensemble divergence."
      badge_color: "amber"
    ood:
      label: "OUT_OF_DISTRIBUTION"
      description: "Input pattern diverges significantly from clinical training distribution."
      badge_color: "purple"
    red_flag:
      label: "CRITICAL_RED_FLAG"
      description: "Urgent clinical abnormality detected by physician rules overriding statistical baseline."
      badge_color: "red"

# ==============================================================================
# Clinical Red-Flag Diagnostic Rules (Rule-Based Overrides)
# ==============================================================================
red_flags:
  heart:
    - condition: "trestbps >= 180"
      feature: "trestbps"
      threshold: 180
      severity: "CRITICAL"
      message: "Hypertensive Crisis: Resting blood pressure >= 180 mmHg requires urgent medical evaluation."
    - condition: "oldpeak >= 4.0"
      feature: "oldpeak"
      threshold: 4.0
      severity: "HIGH"
      message: "Severe ST depression (>= 4.0 mm) strongly indicates critical myocardial ischemia."
    - condition: "thalach <= 55"
      feature: "thalach"
      threshold: 55
      severity: "HIGH"
      message: "Profound bradycardia during exercise test (peak HR <= 55 bpm)."
    - condition: "ca >= 3"
      feature: "ca"
      threshold: 3
      severity: "HIGH"
      message: "Multi-vessel fluoroscopy calcification (3 major vessels affected)."

  diabetes:
    - condition: "Glucose >= 300"
      feature: "Glucose"
      threshold: 300
      severity: "CRITICAL"
      message: "Severe Hyperglycemia: Blood glucose >= 300 mg/dL poses acute ketoacidosis/HHS risk."
    - condition: "Glucose <= 50"
      feature: "Glucose"
      threshold: 50
      severity: "CRITICAL"
      message: "Severe Hypoglycemia: Blood glucose <= 50 mg/dL is acutely life-threatening."
    - condition: "BMI >= 45.0"
      feature: "BMI"
      threshold: 45.0
      severity: "HIGH"
      message: "Class III Morbid Obesity (BMI >= 45.0 kg/m^2)."
    - condition: "BloodPressure >= 120"
      feature: "BloodPressure"
      threshold: 120
      severity: "HIGH"
      message: "Diastolic blood pressure >= 120 mmHg indicates severe hypertension."

  parkinsons:
    - condition: "MDVP:Jitter(%) >= 0.03"
      feature: "MDVP:Jitter(%)"
      threshold: 0.03
      severity: "HIGH"
      message: "Pronounced fundamental frequency perturbation (> 3%), characteristic of severe dysphonia."
    - condition: "MDVP:Shimmer >= 0.15"
      feature: "MDVP:Shimmer"
      threshold: 0.15
      severity: "HIGH"
      message: "Extremely high amplitude shimmer (> 0.15), indicative of severe phonatory dysfunction."
    - condition: "HNR <= 8.0"
      feature: "HNR"
      threshold: 8.0
      severity: "HIGH"
      message: "Severely degraded Harmonics-to-Noise Ratio (<= 8 dB), reflecting profound vocal roughness."

  liver:
    - condition: "Total_Bilirubin >= 5.0"
      feature: "Total_Bilirubin"
      threshold: 5.0
      severity: "CRITICAL"
      message: "Severe Hyperbilirubinemia (>= 5.0 mg/dL): Clinical jaundice and severe hepatic impairment."
    - condition: "Alamine_Aminotransferase >= 350"
      feature: "Alamine_Aminotransferase"
      threshold: 350
      severity: "CRITICAL"
      message: "Markedly elevated ALT (>= 350 IU/L): Acute hepatocellular injury or active hepatitis."
    - condition: "Aspartate_Aminotransferase >= 350"
      feature: "Aspartate_Aminotransferase"
      threshold: 350
      severity: "CRITICAL"
      message: "Markedly elevated AST (>= 350 IU/L): Acute liver necrosis or severe toxic hepatopathy."
    - condition: "Albumin <= 2.0"
      feature: "Albumin"
      threshold: 2.0
      severity: "HIGH"
      message: "Severe Hypoalbuminemia (<= 2.0 g/dL): Advanced synthetic liver failure or cirrhosis."

