    missing_markers: ["?", "NA", "null", ""]
    columns:
      - "name"
      - "MDVP:Fo(Hz)"
      - "MDVP:Fhi(Hz)"
      - "MDVP:Flo(Hz)"
      - "MDVP:Jitter(%)"
      - "MDVP:Jitter(Abs)"
      - "MDVP:RAP"
      - "MDVP:PPQ"
      - "Jitter:DDP"
      - "MDVP:Shimmer"
      - "MDVP:Shimmer(dB)"
      - "Shimmer:APQ3"
      - "Shimmer:APQ5"
      - "MDVP:APQ"
      - "Shimmer:DDA"
      - "NHR"
      - "HNR"
      - "status"
      - "RPDE"
      - "DFA"
      - "spread1"
      - "spread2"
      - "D2"
      - "PPE"
    features:
      - "MDVP:Fo(Hz)"
      - "MDVP:Fhi(Hz)"
      - "MDVP:Flo(Hz)"
      - "MDVP:Jitter(%)"
      - "MDVP:Jitter(Abs)"
      - "MDVP:RAP"
      - "MDVP:PPQ"
      - "Jitter:DDP"
      - "MDVP:Shimmer"
      - "MDVP:Shimmer(dB)"
      - "Shimmer:APQ3"
      - "Shimmer:APQ5"
      - "MDVP:APQ"
      - "Shimmer:DDA"
      - "NHR"
      - "HNR"
      - "RPDE"
      - "DFA"
      - "spread1"
      - "spread2"
      - "D2"
      - "PPE"
    numeric_features:
      - "MDVP:Fo(Hz)"
      - "MDVP:Fhi(Hz)"
      - "MDVP:Flo(Hz)"
      - "MDVP:Jitter(%)"
      - "MDVP:Jitter(Abs)"
      - "MDVP:RAP"
      - "MDVP:PPQ"
      - "Jitter:DDP"
      - "MDVP:Shimmer"
      - "MDVP:Shimmer(dB)"
      - "Shimmer:APQ3"
      - "Shimmer:APQ5"
      - "MDVP:APQ"
      - "Shimmer:DDA"
      - "NHR"
      - "HNR"
      - "RPDE"
      - "DFA"
      - "spread1"
      - "spread2"
      - "D2"
      - "PPE"
    categorical_features: []
    zero_as_missing: []
    imputation:
      numeric: "median"
      categorical: "mode"
    scaling: "standard"
    handle_imbalance: "smote"

  liver:
    file_name: "liver.csv"
    has_header: false
    target: "target"
    raw_target_column: "Dataset"
    target_mapping:
      1: 1
      2: 0
    missing_markers: ["?", "NA", "null", ""]
    columns:
      - "Age"
      - "Gender"
      - "Total_Bilirubin"
      - "Direct_Bilirubin"
      - "Alkaline_Phosphotase"
      - "Alamine_Aminotransferase"
      - "Aspartate_Aminotransferase"
      - "Total_Protiens"
      - "Albumin"
      - "Albumin_and_Globulin_Ratio"
